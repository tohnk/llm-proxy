name: Update Homebrew Tap
on:
  release:
    types: [published]
jobs:
  update-tap:
    runs-on: macos-latest
    steps:
      - name: Bump Homebrew Formula
        # TODO: pin to a full commit SHA. This step receives a tap token, and a
        # mutable tag means whoever can move `v4` can run arbitrary code with
        # that token. Resolve and pin with:
        #   gh api repos/mislav/bump-homebrew-formula-action/git/ref/tags/v4 --jq .object.sha
        # then replace the tag below with `@<sha>  # v4`.
        uses: mislav/bump-homebrew-formula-action@v4
        with:
          formula-name: llm-proxy
          homebrew-tap: tohnk/homebrew-tap
          download-url: https://github.com/tohnk/llm-proxy/archive/refs/tags/${{ github.event.release.tag_name }}.tar.gz
        env:
          COMMITTER_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
